name: "Exemple de workflow pour javascript + docker"
on:
  push:
    branches:
      - main

jobs:
  greet-user:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Dire bonjour
      uses: ./actions/
      with:
        username: "Jean"
        greeting: "Salut"
  greet-user-on-js:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Exécuter l'action Docker
      uses: ./docker_workflow/
      with:
        message: "Salut de l'action Docker"
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - uses: actions/checkout@v4
      - id: foo
        # Exécution locale (même dépôt) pour valider rapidement l'action
        uses: ./action_composite/
        # Variante pédagogique : référencer l'action distante versionnée
        # uses: <OWNER>/<REPO>@<TAG_OU_SHA>
        with:
          who-to-greet: 'Mona the Octocat'
      - run: echo random-number "$RANDOM_NUMBER"
        shell: bash
        env:
          RANDOM_NUMBER: ${{ steps.foo.outputs.random-number }}