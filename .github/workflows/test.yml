name: "Exemple de workflow pour javascript + docker"
on:
  push:
    branches:
      - main

jobs:
  greet-user:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Dire bonjour
      uses: ./actions/
      with:
        username: "Jean"
        greeting: "Salut"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Exécuter l'action Docker
      uses: ./docker_workflow/
      with:
        message: "Salut de l'action Docker"